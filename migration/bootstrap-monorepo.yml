# À copier-coller dans le NOUVEAU repo MoKarade/hub, à l'emplacement :
#   .github/workflows/bootstrap-monorepo.yml
#
# NE PAS placer ce fichier dans .github/workflows/ de hub-docs : il s'enregistrerait
# sur le mauvais repo et tenterait d'importer hub-docs dans lui-même.
#
# Prérequis avant déclenchement :
#   1. MoKarade/hub a été créé sur GitHub avec README initial (donc branche main existe).
#   2. Aucun autre commit n'a été fait sur main (le workflow ajoute des commits dessus).
#   3. Branch protection désactivée sur main (sinon le push final échoue).
#   4. Tous les repos sources sont publics (sinon ajouter un PAT, voir bloc commenté).

name: Bootstrap monorepo

on:
  workflow_dispatch:
    inputs:
      repos:
        description: |
          JSON array. Chaque entrée :
            { "repo": "MoKarade/<nom>", "prefix": "<dossier-cible>", "branch": "main" }
          Exemple complet (à AJUSTER selon les noms réels avant de cliquer Run) :
          [
            {"repo":"MoKarade/hub-core",     "prefix":"hub-core",     "branch":"main"},
            {"repo":"MoKarade/hub-frontend", "prefix":"hub-frontend", "branch":"main"},
            {"repo":"MoKarade/hub-ingest",   "prefix":"hub-ingest",   "branch":"main"},
            {"repo":"MoKarade/hub-deploy",   "prefix":"hub-deploy",   "branch":"main"},
            {"repo":"MoKarade/hub-docs",     "prefix":"docs",         "branch":"main"},
            {"repo":"MoKarade/app-trajets",  "prefix":"apps/trajets", "branch":"main"},
            {"repo":"MoKarade/app-finance",  "prefix":"apps/finance", "branch":"main"}
          ]
        required: true
        default: '[]'
      squash:
        description: "Squash chaque import en un seul commit (recommandé)"
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout monorepo (état initial : README seul)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier que le repo est encore vierge
        run: |
          set -euo pipefail
          # On accepte uniquement 1 commit (l'init README) sur main.
          COMMITS=$(git rev-list --count HEAD)
          if [ "$COMMITS" -gt 1 ]; then
            echo "::error::Le repo a déjà $COMMITS commits. Le bootstrap doit tourner sur un repo neuf (1 commit init)."
            echo "Si tu veux ré-importer après un échec, supprime le repo et recrée-le."
            exit 1
          fi

      - name: Configurer git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Valider le JSON d'entrée
        run: |
          set -euo pipefail
          echo '${{ inputs.repos }}' | jq -e 'type == "array" and length > 0' >/dev/null \
            || { echo "::error::inputs.repos doit être un JSON array non vide"; exit 1; }
          echo '${{ inputs.repos }}' | jq -e 'all(.repo and .prefix and .branch)' >/dev/null \
            || { echo "::error::Chaque entrée doit avoir repo, prefix, branch"; exit 1; }

      - name: Importer chaque repo via git subtree
        env:
          REPOS_JSON: ${{ inputs.repos }}
          SQUASH: ${{ inputs.squash }}
          # Pour repos privés, décommenter et configurer un secret SOURCE_PAT
          # avec scope Contents:Read sur les repos sources :
          # SOURCE_PAT: ${{ secrets.SOURCE_PAT }}
        run: |
          set -euo pipefail

          SQUASH_FLAG=""
          if [ "$SQUASH" = "true" ]; then
            SQUASH_FLAG="--squash"
          fi

          echo "$REPOS_JSON" | jq -c '.[]' | while read -r item; do
            REPO=$(echo   "$item" | jq -r '.repo')
            PREFIX=$(echo "$item" | jq -r '.prefix')
            BRANCH=$(echo "$item" | jq -r '.branch')

            echo "::group::Import $REPO ($BRANCH) -> $PREFIX"

            # URL anonyme (repos publics). Pour privés : remplacer par
            # https://x-access-token:${SOURCE_PAT}@github.com/${REPO}.git
            URL="https://github.com/${REPO}.git"

            git subtree add --prefix="$PREFIX" "$URL" "$BRANCH" $SQUASH_FLAG \
              -m "import: $REPO@$BRANCH -> $PREFIX (squash=$SQUASH)"

            # Tag traçant l'origine de l'import (1 tag par sous-arbre).
            TAG="import/$(echo "$PREFIX" | tr '/' '-')-$(date +%Y%m%d)"
            git tag -a "$TAG" -m "Imported from $REPO@$BRANCH on $(date -u +%FT%TZ)"

            echo "::endgroup::"
          done

      - name: Pousser commits + tags
        run: |
          git push origin HEAD:main
          git push origin --tags

      - name: Récap
        run: |
          echo "## Imports effectués" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ inputs.repos }}' | jq -r '.[] | "- `\(.repo)@\(.branch)` -> `\(.prefix)`"' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags créés : voir \`git tag -l 'import/*'\`" >> "$GITHUB_STEP_SUMMARY"
